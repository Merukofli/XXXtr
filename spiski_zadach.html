<style>
:root{--light:#F5D5E0;--blue:#6667AB;--mid:#7B337E;--deep:#420D4B;--dark:#210635;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;min-height:100vh;background:linear-gradient(165deg,#420D4B 0%,#210635 70%);color:var(--light);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;}
header{padding:18px 16px 0;}
.brand{font-size:26px;font-weight:600;letter-spacing:.5px;color:var(--light);}
.tabs{display:flex;gap:8px;margin-top:14px;}
.tabs button{flex:1;padding:10px 4px;border:1px solid rgba(245,213,224,.25);border-radius:12px;background:rgba(33,6,53,.35);color:var(--light);font-size:15px;}
.tabs button.on{background:var(--mid);border-color:var(--mid);font-weight:600;}
main{padding:14px 14px 40px;}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid rgba(102,103,171,.6);background:rgba(102,103,171,.15);color:var(--light);font-size:14px;}
.chip.on{background:var(--blue);border-color:var(--blue);font-weight:600;}
.chip.add{border-style:dashed;color:var(--blue);}
.listhead{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 6px;}
.listhead h2{margin:0;font-size:20px;}
.tools{display:flex;gap:6px;}
.mini{border:none;background:rgba(245,213,224,.12);color:var(--light);border-radius:8px;padding:4px 9px;font-size:13px;}
.task{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:rgba(33,6,53,.5);border:1px solid rgba(123,51,126,.45);border-radius:12px;margin-bottom:8px;}
.box{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--blue);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--light);}
.box.done{background:var(--mid);border-color:var(--mid);}
.box.small{width:19px;height:19px;font-size:11px;margin-top:1px;}
.txt{flex:1;word-break:break-word;line-height:1.35;}
.txt.strike{text-decoration:line-through;opacity:.55;}
.subs{margin:2px 0 8px 34px;}
.subs .task{padding:8px 10px;border-color:rgba(123,51,126,.28);background:rgba(33,6,53,.3);}
.empty{opacity:.6;text-align:center;padding:22px 0;}
.addrow{display:flex;gap:8px;margin-top:12px;}
.addrow input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid rgba(102,103,171,.5);background:rgba(33,6,53,.55);color:var(--light);font-size:15px;}
.addrow input::placeholder{color:rgba(245,213,224,.4);}
.addrow button{width:46px;border:none;border-radius:12px;background:var(--mid);color:var(--light);font-size:20px;}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.quad{background:rgba(33,6,53,.5);border:1px solid rgba(123,51,126,.5);border-radius:14px;padding:10px;}
.quad h3{margin:0 0 8px;font-size:13px;letter-spacing:.3px;color:var(--blue);text-transform:uppercase;}
.quad ul{list-style:none;margin:0;padding:0;}
.quad .task{padding:8px 9px;margin-bottom:6px;border-radius:10px;}
.quad .addrow{margin-top:8px;}
.quad .addrow input{padding:8px 10px;font-size:13px;}
.quad .addrow button{width:34px;font-size:16px;}
.hint{font-size:14px;line-height:1.5;opacity:.85;}
.wpreview{white-space:pre-wrap;background:rgba(33,6,53,.6);border:1px solid rgba(123,51,126,.5);border-radius:14px;padding:14px;font-family:inherit;font-size:14px;line-height:1.5;max-height:46vh;overflow:auto;}
.btnrow{display:flex;gap:10px;margin-top:14px;}
.big{flex:1;padding:13px;border:none;border-radius:14px;background:var(--mid);color:var(--light);font-size:15px;font-weight:600;}
.big.alt{background:rgba(102,103,171,.5);}
</style>
</head>
<body>
<header>
  <div class="brand">Списки задач</div>
  <nav class="tabs">
    <button data-act="tab" data-tab="lists" class="on">Списки</button>
    <button data-act="tab" data-tab="matrix">Матрица</button>
    <button data-act="tab" data-tab="widget">Виджет</button>
  </nav>
</header>
<main id="app"></main>
<script>
'use strict';
const KEY='moon_tasks_v4';
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.lists)&&d.matrix)return d;}catch(e){}
return {tab:'lists',active:0,lists:[{id:uid(),name:'Мои дела',tasks:[]}],matrix:{q1:[],q2:[],q3:[],q4:[]}};}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const app=document.getElementById('app');
document.addEventListener('click',onClick);
document.addEventListener('submit',onSubmit);

function findTask(id){return S.lists[S.active].tasks.find(t=>t.id===id);}

function onClick(e){
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(act==='tab'){S.tab=b.dataset.tab;}
  else if(act==='addlist'){const n=prompt('Название списка','Новый список');if(n&&n.trim()){S.lists.push({id:uid(),name:n.trim(),tasks:[]});S.active=S.lists.length-1;}}
  else if(act==='picklist'){S.active=+b.dataset.i;}
  else if(act==='renamelist'){const L=S.lists[S.active];const n=prompt('Название списка',L.name);if(n&&n.trim())L.name=n.trim();}
  else if(act==='dellist'){if(S.lists.length>1&&confirm('Удалить список «'+S.lists[S.active].name+'»?')){S.lists.splice(S.active,1);S.active=0;}}
  else if(act==='toggle'){const t=findTask(b.dataset.t);if(t){t.done=!t.done;if(t.done)t.subs.forEach(s=>s.done=true);}}
  else if(act==='toggletext'){const t=findTask(b.dataset.t);const n=prompt('Изменить задачу',t.text);if(n&&n.trim())t.text=n.trim();}
  else if(act==='addsub'){const t=findTask(b.dataset.t);const n=prompt('Новый подпункт');if(n&&n.trim()&&t){t.subs.push({id:uid(),text:n.trim(),done:false});t.collapsed=false;}}
  else if(act==='collapse'){const t=findTask(b.dataset.t);t.collapsed=!t.collapsed;}
  else if(act==='deltask'){const L=S.lists[S.active];const i=L.tasks.findIndex(x=>x.id===b.dataset.t);if(i>-1)L.tasks.splice(i,1);}
  else if(act==='subtoggle'){const t=findTask(b.dataset.t);const s=t.subs.find(x=>x.id===b.dataset.s);if(s)s.done=!s.done;}
  else if(act==='subtext'){const t=findTask(b.dataset.t);const s=t.subs.find(x=>x.id===b.dataset.s);const n=prompt('Изменить подпункт',s.text);if(n&&n.trim())s.text=n.trim();}
  else if(act==='subdel'){const t=findTask(b.dataset.t);t.subs=t.subs.filter(x=>x.id!==b.dataset.s);}
  else if(act==='mtoggle'){const it=S.matrix[b.dataset.q].find(x=>x.id===b.dataset.t);if(it)it.done=!it.done;}
  else if(act==='mtext'){const it=S.matrix[b.dataset.q].find(x=>x.id===b.dataset.t);const n=prompt('Изменить задачу',it.text);if(n&&n.trim())it.text=n.trim();}
  else if(act==='mdel'){S.matrix[b.dataset.q]=S.matrix[b.dataset.q].filter(x=>x.id!==b.dataset.t);}
  else if(act==='copy'){copyWidget();return;}
  else if(act==='dl'){downloadWidget();return;}
  save();render();
}
function onSubmit(e){
  const f=e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  const inp=f.querySelector('input'); const v=inp.value.trim(); if(!v) return;
  if(f.dataset.form==='task'){S.lists[S.active].tasks.push({id:uid(),text:v,done:false,collapsed:false,subs:[]});}
  else if(f.dataset.form==='m'){S.matrix[f.dataset.q].push({id:uid(),text:v,done:false});}
  inp.value=''; save(); render(); const ni=document.getElementById('newtask'); if(ni) ni.focus();
}

function taskHtml(t){
  let h='<div class="task">'
    +'<span class="box'+(t.done?' done':'')+'" data-act="toggle" data-t="'+t.id+'">'+(t.done?'✓':'')+'</span>'
    +'<span class="txt'+(t.done?' strike':'')+'" data-act="toggletext" data-t="'+t.id+'">'+esc(t.text)+'</span>'
    +'<span class="tools">'
    +'<button class="mini" data-act="addsub" data-t="'+t.id+'">＋</button>'
    +(t.subs.length?'<button class="mini" data-act="collapse" data-t="'+t.id+'">'+(t.collapsed?'▸':'▾')+'</button>':'')
    +'<button class="mini" data-act="deltask" data-t="'+t.id+'">✕</button>'
    +'</span></div>';
  if(t.subs.length&&!t.collapsed){
    h+='<div class="subs">';
    t.subs.forEach(s=>{
      h+='<div class="task">'
        +'<span class="box small'+(s.done?' done':'')+'" data-act="subtoggle" data-t="'+t.id+'" data-s="'+s.id+'">'+(s.done?'✓':'')+'</span>'
        +'<span class="txt'+(s.done?' strike':'')+'" data-act="subtext" data-t="'+t.id+'" data-s="'+s.id+'">'+esc(s.text)+'</span>'
        +'<span class="tools"><button class="mini" data-act="subdel" data-t="'+t.id+'" data-s="'+s.id+'">✕</button></span>'
        +'</div>';
    });
    h+='</div>';
  }
  return h;
}
function renderLists(){
  let h='<div class="chips">';
  S.lists.forEach((L,i)=>{h+='<button class="chip'+(i===S.active?' on':'')+'" data-act="picklist" data-i="'+i+'">'+esc(L.name)+'</button>';});
  h+='<button class="chip add" data-act="addlist">+ список</button></div>';
  const L=S.lists[S.active];
  h+='<div class="listhead"><h2>'+esc(L.name)+'</h2><span class="tools">'
    +'<button class="mini" data-act="renamelist">✎</button>'
    +(S.lists.length>1?'<button class="mini" data-act="dellist">✕</button>':'')
    +'</span></div>';
  L.tasks.forEach(t=>{h+=taskHtml(t);});
  if(!L.tasks.length)h+='<div class="empty">Пока пусто — добавьте первую задачу ↓</div>';
  h+='<form class="addrow" data-form="task"><input id="newtask" autocomplete="off" placeholder="Новая задача…"><button type="submit">＋</button></form>';
  app.innerHTML=h;
}
const QN=[['q1','Срочно и важно'],['q2','Важно, не срочно'],['q3','Срочно, не важно'],['q4','Ни то ни то']];
function renderMatrix(){
  let h='<div class="mgrid">';
  QN.forEach(q=>{
    const k=q[0],label=q[1];
    h+='<section class="quad"><h3>'+label+'</h3>';
    S.matrix[k].forEach(t=>{
      h+='<div class="task">'
        +'<span class="box small'+(t.done?' done':'')+'" data-act="mtoggle" data-q="'+k+'" data-t="'+t.id+'">'+(t.done?'✓':'')+'</span>'
        +'<span class="txt'+(t.done?' strike':'')+'" data-act="mtext" data-q="'+k+'" data-t="'+t.id+'">'+esc(t.text)+'</span>'
        +'<span class="tools"><button class="mini" data-act="mdel" data-q="'+k+'" data-t="'+t.id+'">✕</button></span>'
        +'</div>';
    });
    h+='<form class="addrow" data-form="m" data-q="'+k+'"><input autocomplete="off" placeholder="Добавить…"><button type="submit">＋</button></form></section>';
  });
  h+='</div>';
  app.innerHTML=h;
}
function widgetText(){
  let out='';
  S.lists.forEach(L=>{
    out+='◈ '+L.name+'\n';
    L.tasks.forEach(t=>{
      out+=(t.done?'☑':'☐')+' '+t.text+'\n';
      if(!t.collapsed)t.subs.forEach(s=>{out+='   '+(s.done?'☑':'☐')+' '+s.text+'\n';});
    });
    out+='\n';
  });
  QN.forEach(q=>{
    const k=q[0];
    if(S.matrix[k].length){out+='▦ '+q[1]+'\n';S.matrix[k].forEach(t=>out+=(t.done?'☑':'☐')+' '+t.text+'\n');out+='\n';}
  });
  return out.trim();
}
function renderWidget(){
  const txt=widgetText();
  app.innerHTML='<p class="hint">Предпросмотр текста для виджета: вставьте его в KWGT (Android) или в заметку для виджета «Заметки» (iPhone). После изменений в приложении скопируйте текст заново.</p>'
    +'<pre class="wpreview">'+(esc(txt)||'Пока пусто')+'</pre>'
    +'<div class="btnrow"><button class="big" data-act="copy">Скопировать</button><button class="big alt" data-act="dl">Скачать .txt</button></div>';
}
function copyWidget(){
  const txt=widgetText();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>alert('Скопировано')).catch(()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');alert('Скопировано');}catch(e){alert('Не удалось — выделите текст в предпросмотре вручную');}
  ta.remove();
}
function downloadWidget(){
  const b=new Blob([widgetText()],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='spiski_zadach.txt';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  if(S.tab==='lists')renderLists();else if(S.tab==='matrix')renderMatrix();else renderWidget();
}
render();
</script>
</body>
